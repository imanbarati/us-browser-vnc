services:
  browser:
    build: ./docker
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:6080:6080"
    shm_size: 512mb

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - browser
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
